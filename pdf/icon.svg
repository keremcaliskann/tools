<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Document shape with folded corner -->
  <g filter="url(#shadow)">
    <path d="M148 100 H300 L372 172 V412 H148 Z" fill="url(#docGrad)" rx="8" />
    <path d="M300 100 V172 H372 Z" fill="#CBD5E1" />
  </g>

  <!-- PDF Badge -->
  <rect x="180" y="240" width="152" height="48" rx="10" fill="#EF4444" />
  <text x="256" y="274" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3">PDF</text>

  <!-- Tools Decorative Shapes (Wrench / Sparkle) -->
  <circle cx="340" cy="350" r="28" fill="#3B82F6" opacity="0.9" filter="url(#shadow)" />
  <path d="M334 338 L346 350 M346 338 L334 350" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <circle cx="170" cy="350" r="28" fill="#10B981" opacity="0.9" filter="url(#shadow)" />
  <path d="M162 350 L168 356 L178 344" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
