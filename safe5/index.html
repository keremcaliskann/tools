<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe5 — Fabrika Çalışan Geri Bildirim &amp; Analitik Sistemi</title>
  <meta name="description" content="Endüstriyel standartlara uygun, 5S, İSG, Kaizen ve Takdir odaklı fabrika geri bildirim ve yönetim analitik platformu." />

  <!-- PWA & Favicon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Safe5" />

  <!-- Uygulama Stilleri (Yumuşak Açık Tasarım) -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Firebase SDK (Çok Cihazlı Canlı Veritabanı Desteği) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js Analitik Grafikleri -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Ana Uygulama Mantığı -->
  <script src="js/app.js" defer></script>
</head>
<body data-theme="light">

  <!-- Yeni Temiz Uygulama Üst Başlığı (Navbar Kaldırıldı) -->
  <header class="safe-top-bar" id="safeTopBar">
    <div class="safe-top-bar-left">
      <img src="icon.svg" alt="Safe5" class="safe-top-bar-logo" />
      <div>
        <h1 class="safe-top-bar-title">Safe5 — Fabrika İletişim &amp; Geri Bildirim Sistemi</h1>
        <div class="safe-top-bar-subtitle">Endüstriyel 5S, İSG &amp; Kaizen Takdir Platformu</div>
      </div>
    </div>

    <div class="safe-top-bar-right" id="safeTopBarUserArea">
      <!-- Kullanıcı giriş yaptığında JavaScript tarafından doldurulacaktır -->
    </div>
  </header>

  <!-- Uygulama Dinamik Montaj Alanı -->
  <main id="safeAppRoot">
    <noscript>
      <div style="padding: 2.5rem; text-align: center; color: #1e293b;">
        Safe5 uygulamasını kullanabilmek için tarayıcınızda JavaScript'in etkin olması gerekmektedir.
      </div>
    </noscript>
  </main>

  <!-- Alt Bilgi -->
  <footer style="background: #ffffff; border-top: 1px solid #e2e8f0; padding: 1.25rem 1.5rem; text-align: center; font-size: 0.82rem; color: #64748b;">
    Safe5 &copy; 2026 | Güvenli, Rol Tabanlı &amp; Endüstriyel Fabrika Portalı
  </footer>

</body>
</html>
