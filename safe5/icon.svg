<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="safe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f2b3c" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="safe-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="safe-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="safe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kare -->
  <rect width="512" height="512" rx="112" fill="url(#safe-bg)" />

  <!-- Dış Güvenlik Kalkanı -->
  <path d="M256 64 C350 64, 416 100, 416 180 C416 310, 320 400, 256 448 C192 400, 96 310, 96 180 C96 100, 162 64, 256 64 Z" 
        fill="#0f172a" 
        stroke="url(#safe-accent)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- İç Kalkan Işıltısı -->
  <path d="M256 90 C330 90, 390 120, 390 185 C390 295, 308 375, 256 418 C204 375, 122 295, 122 185 C122 120, 182 90, 256 90 Z" 
        fill="url(#safe-accent)" 
        opacity="0.12" />

  <!-- Sanayi Dişlisi / Fabrika Çarkı (Merkezde) -->
  <g transform="translate(256, 230)" fill="none" stroke="#10b981" stroke-width="8">
    <circle r="60" stroke="url(#safe-accent)" stroke-width="10" />
    <path d="M-12 -72 L12 -72 L8 -55 L-8 -55 Z" fill="#10b981" />
    <path d="M-12 72 L12 72 L8 55 L-8 55 Z" fill="#10b981" />
    <path d="M-72 -12 L-72 12 L-55 8 L-55 -8 Z" fill="#10b981" />
    <path d="M72 -12 L72 12 L55 8 L55 -8 Z" fill="#10b981" />
    <path d="M-52 -52 L-35 -35 L-25 -45 L-42 -62 Z" fill="#10b981" />
    <path d="M52 52 L35 35 L25 45 L42 62 Z" fill="#10b981" />
    <path d="M-52 52 L-35 35 L-25 45 L-42 62 Z" fill="#10b981" transform="rotate(90)" />
    <path d="M52 -52 L35 -35 L25 -45 L42 -62 Z" fill="#10b981" transform="rotate(90)" />
  </g>

  <!-- Güvenlik Bareti / Kask Silüeti (Merkez) -->
  <path d="M196 230 C196 180, 316 180, 316 230 L326 238 L186 238 Z" fill="url(#safe-gold)" filter="url(#safe-glow)" />
  <rect x="180" y="238" width="152" height="12" rx="6" fill="#f59e0b" />
  <rect x="250" y="184" width="12" height="42" rx="4" fill="#ffffff" opacity="0.6" />

  <!-- Karşılıklı 2 Konuşma / Geri Bildirim Balonu (Peer Feedback) -->
  <path d="M150 285 C150 265, 175 255, 205 255 C235 255, 260 265, 260 285 C260 300, 245 312, 225 315 L225 330 L205 315 C175 315, 150 302, 150 285 Z" fill="#38bdf8" opacity="0.9" />
  <!-- Geri bildirim kalbi / başparmağı -->
  <circle cx="190" cy="285" r="4" fill="#0f172a" />
  <circle cx="205" cy="285" r="4" fill="#0f172a" />
  <circle cx="220" cy="285" r="4" fill="#0f172a" />

  <path d="M362 305 C362 288, 340 278, 315 278 C290 278, 268 288, 268 305 C268 318, 280 328, 298 332 L298 344 L315 332 C340 332, 362 320, 362 305 Z" fill="#10b981" opacity="0.95" />
  <path d="M308 305 L314 311 L324 299" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 5S Yıldızları / Rozetler (Alt Yay) -->
  <g fill="url(#safe-gold)">
    <polygon points="256,360 261,374 276,374 264,383 268,397 256,388 244,397 248,383 236,374 251,374" />
    <polygon points="214,345 218,356 230,356 220,363 223,374 214,367 205,374 208,363 198,356 210,356" transform="scale(0.85) translate(40, 50)" />
    <polygon points="298,345 302,356 314,356 304,363 307,374 298,367 289,374 292,363 282,356 294,356" transform="scale(0.85) translate(40, 50)" />
  </g>
</svg>