<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Shield Body Gradient -->
    <linearGradient id="shieldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>

    <!-- Document Drop Shadow -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid / privacy circle overlay -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- 2. Outer Protective Shield -->
  <g filter="url(#shieldGlow)">
    <path d="M 256 70 
             C 340 70 410 95 410 135 
             C 410 270 345 375 256 435 
             C 167 375 102 270 102 135 
             C 102 95 172 70 256 70 Z" 
          fill="url(#shieldBody)" 
          stroke="url(#shieldBorder)" 
          stroke-width="7" />
  </g>

  <!-- 3. Document Inside Shield -->
  <g filter="url(#docShadow)">
    <!-- Main Sheet (Folded top-right corner) -->
    <path d="M 175 140 
             H 305 
             L 342 177 
             V 345 
             C 342 350 338 354 333 354 
             H 175 
             C 170 354 166 350 166 345 
             V 149 
             C 166 144 170 140 175 140 Z" 
          fill="url(#docGrad)" />

    <!-- Corner fold flap -->
    <path d="M 305 140 V 177 H 342 Z" fill="#cbd5e1" />
    <path d="M 305 177 L 342 177" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Document Header & Text Lines -->
    <rect x="190" y="170" width="70" height="7" rx="3.5" fill="#3b82f6" />
    <rect x="190" y="195" width="128" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="190" y="210" width="115" height="5" rx="2.5" fill="#cbd5e1" />

    <!-- Redacted Bar (Visualizing R2 True Pixel Redaction) -->
    <rect x="190" y="226" width="90" height="12" rx="3" fill="#0f172a" />

    <rect x="190" y="248" width="128" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="190" y="262" width="75" height="5" rx="2.5" fill="#94a3b8" />

    <!-- Watermark Stamp (Visualizing R1 Security Watermark) -->
    <g transform="rotate(-25 254 285)">
      <rect x="195" y="272" width="118" height="26" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.85" />
      <text x="254" y="290" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2.5" opacity="0.85">GÜVENLİ</text>
    </g>
  </g>

  <!-- 4. Security Padlock (Bottom Center) -->
  <g filter="url(#shieldGlow)" transform="translate(256, 360)">
    <!-- Padlock Shackle -->
    <path d="M -16 -10 V -24 C -16 -33 -9 -40 0 -40 C 9 -40 16 -33 16 -24 V -10" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="6.5" 
          stroke-linecap="round" />

    <!-- Padlock Body -->
    <rect x="-26" y="-10" width="52" height="42" rx="10" fill="url(#shieldBorder)" />

    <!-- Keyhole -->
    <circle cx="0" cy="8" r="4.5" fill="#ffffff" />
    <path d="M -2.5 10 L 2.5 10 L 4 20 L -4 20 Z" fill="#ffffff" />
  </g>
</svg>
